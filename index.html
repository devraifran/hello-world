    <h1>Aprendendo HTML</h1>
    <h2>O que é HTML?</h2>
    <p>HTML (HyperText Markup Language) é a linguagem padrão para a criação de páginas web. Ela define a estrutura e o conteúdo de um site, utilizando uma série de elementos (tags) para organizar informações como texto, imagens, links e outros elementos visuais. </p>
